{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentAbroad</title>
    <link rel="stylesheet" href="{% static \'project/css/style.css\' %}" />
    <link
      rel="website icon"
      type="png"
      href="{% static \'project/img/logo_01_white.png\' %}" />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap"
      rel="stylesheet" />

    <style>
      body {
        display: flex; /* Вмикаємо Flexbox для body */
        flex-direction: column; /* Елементи один під одним */
        min-height: 100vh; /* Мінімальна висота - весь екран */
        margin: 0; /* Прибираємо стандартні відступи */
      }

      main {
        flex: 1; /* main розтягується і займає все вільне місце, штовхаючи футер вниз */
      }
    </style>
  </head>

  <body>
    <header class="site-header" id="header-footer-color">
      <div class="container">
        <div class="header__container">
          <div class="logo">
            <a href="index.html">
              <img
                src="{% static \'project/img/name_no-background_01.svg\' %}"
                alt=" StudentAbroad logo"
                loading="lazy" />
            </a>
          </div>

          <nav class="header__nav">
            <ul class="header__menu">
              <li>
                <a
                  class="link"
                  href="index.html"
                  data-en="ABOUT US"
                  data-ua="ПРО НАС"
                  >ABOUT US</a
                >
              </li>
              <li>
                <a
                  class="link"
                  href="uni-list.html"
                  data-en="UNI LIST"
                  data-ua="СПИСОК ВНЗ"
                  >UNI LIST</a
                >
              </li>
              <li>
                <a
                  class="link"
                  href="program-list.html"
                  data-en="PROGRAM LIST"
                  data-ua="ПРОГРАМИ"
                  >PROGRAM LIST</a
                >
              </li>
              <li>
                <a class="link" href="./faq.html" data-en="FAQ" data-ua="FAQ"
                  >FAQ</a
                >
              </li>
            </ul>
          </nav>

          <div class="lang-search">
            <span class="language-switch">
              <button data-lang="ua" class="js-switch-button" type="button">
                UA
              </button>
              <button
                data-lang="en"
                class="js-switch-button active"
                type="button">
                EN
              </button>
            </span>
            <div class="search-box">
              <input
                type="text"
                class="search-box__input"
                data-en="Search..."
                data-ua="Пошук..."
                placeholder="Search..." />
            </div>
          </div>

          <input type="checkbox" id="burger-toggle" />
          <label for="burger-toggle" class="burger">
            <span></span>
          </label>
        </div>
      </div>
      <ul class="mobile-menu">
        <li class="abt_us">
          <a class="link" href="index.html" data-en="ABOUT US" data-ua="ПРО НАС"
            >ABOUT US</a
          >
        </li>
        <li>
          <a
            class="link"
            href="uni-list.html"
            data-en="UNI LIST"
            data-ua="СПИСОК ВНЗ"
            >UNI LIST</a
          >
        </li>
        <li>
          <a
            class="link"
            href="program-list.html"
            data-en="PROGRAM LIST"
            data-ua="ПРОГРАМИ"
            >PROGRAM LIST</a
          >
        </li>
        <li>
          <a class="link" href="./faq.html" data-en="FAQ" data-ua="FAQ">FAQ</a>
        </li>
        <li>
          <span class="mobile-language-switch" aria-hidden="true">
            <button
              type="button"
              class="js-switch-button"
              data-lang="ua"
              aria-label="Українська">
              UA
            </button>
            <button
              type="button"
              class="js-switch-button active"
              data-lang="en"
              aria-label="English">
              EN
            </button>
          </span>
        </li>
      </ul>

      <div class="overlay"></div>
    </header>

    <main>
      </main>

    <footer class="footer">
      <div class="container">
        <div class="footer__container">
          <div class="footer__logo">
            <img
              class="footer__img"
              src="{% static \'project/img/name_no-background_01.svg\' %}"
              alt="StudentAbroad logo" />
          </div>

          <div class="footer__bottom-row">
            <nav class="footer__nav">
              <ul class="footer__menu">
                <li>
                  <a
                    class="footer__link"
                    href="#about-us-section"
                    data-en="ABOUT US"
                    data-ua="ПРО НАС"
                    >ABOUT US</a
                  >
                </li>

                <li>
                  <a
                    class="footer__link"
                    href="uni-list.html"
                    data-en="UNI LIST"
                    data-ua="СПИСОК ВНЗ"
                    >UNI LIST</a
                  >
                </li>

                <li>
                  <a
                    class="footer__link"
                    href="program-list.html"
                    data-en="PROGRAM LIST"
                    data-ua="ПРОГРАМИ"
                    >PROGRAM LIST</a
                  >
                </li>

                <li>
                  <a
                    class="footer__link"
                    href="faq.html"
                    data-en="FAQ"
                    data-ua="FAQ"
                    >FAQ</a
                  >
                </li>
              </ul>
            </nav>

            <div class="footer__lang-search">
              <span class="footer__language-switch">
                <button data-lang="ua" class="js-switch-button" type="button">
                  UA
                </button>

                <button
                  data-lang="en"
                  class="js-switch-button active"
                  type="button">
                  EN
                </button>
              </span>

              <div class="footer__search-box">
                <input
                  type="text"
                  class="search-box__input"
                  data-en="Search..."
                  data-ua="Пошук..."
                  placeholder="Search..." />
              </div>

              <button
                type="button"
                class="footer__scroll-indicator"
                role="button"
                tabindex="0">
                <img
                  class="footer__scroll-indicator-img"
                  src="{% static \'project/img/icon_arrow.svg\' %}"
                  alt="Scroll Down Icon" />
              </button>
            </div>
          </div>

          <div class="footer__line"></div>
        </div>
      </div>
    </footer>
    <script src="{% static \'js/main.js \' %}" type="module"></script>
  </body>
</html>
