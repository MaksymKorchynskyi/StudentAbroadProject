# ============================================================
# Nginx Configuration — StudentAbroad
# ============================================================
# Скопіювати на сервер:
#   sudo cp deployment/nginx/studentabroad.conf /etc/nginx/sites-available/studentabroad
#   sudo ln -s /etc/nginx/sites-available/studentabroad /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl restart nginx
#
# Потім отримати SSL:
#   sudo certbot --nginx -d studentabroad.org.ua -d www.studentabroad.org.ua
# ============================================================

# ===== HTTP Server (certbot автоматично додасть HTTPS після запуску) =====
server {
    listen 80;
    server_name studentabroad.org.ua www.studentabroad.org.ua;

    # ===== Security Headers =====
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ===== Gzip Compression =====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # ===== Client Settings =====
    client_max_body_size 10M;  # Для завантаження зображень університетів

    # ===== Static Files =====
    location /static/ {
        alias /home/studentabroad/app/StudentAbroadProject/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ===== Project Static Files (HTML templates use ./project/ paths) =====
    location /project/ {
        alias /home/studentabroad/app/StudentAbroadProject/backend/staticfiles/project/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ===== Media Files =====
    location /media/ {
        alias /home/studentabroad/app/StudentAbroadProject/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ===== Favicon =====
    location /favicon.ico {
        alias /home/studentabroad/app/StudentAbroadProject/backend/staticfiles/project/img/logo_part1.svg;
        access_log off;
        log_not_found off;
    }

    # ===== Django Application (Gunicorn) =====
    location / {
        proxy_pass http://unix:/run/gunicorn/studentabroad.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ===== Block common attack paths =====
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|bak|old|sql)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
