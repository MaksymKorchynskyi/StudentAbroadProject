# ============================================================
# Nginx Configuration — StudentAbroad (Docker)
# ============================================================

server {
    listen 80;
    server_name studentabroad.org.ua www.studentabroad.org.ua;

    # Certbot ACME challenge (для отримання та оновлення сертифікатів)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Весь інший HTTP-трафік — редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name studentabroad.org.ua www.studentabroad.org.ua;

    # ===== SSL Certificates =====
    ssl_certificate /etc/letsencrypt/live/studentabroad.org.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studentabroad.org.ua/privkey.pem;

    # Рекомендовані параметри безпеки SSL (завантажуються скриптом ініціалізації)
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ===== Security Headers =====
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ===== Gzip Compression =====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # ===== Client Settings =====
    client_max_body_size 10M;

    # ===== Static Files =====
    location /static/ {
        alias /home/studentabroad/app/StudentAbroadProject/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /project/ {
        alias /home/studentabroad/app/StudentAbroadProject/backend/staticfiles/project/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ===== Media Files =====
    location /media/ {
        alias /home/studentabroad/app/StudentAbroadProject/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ===== Favicon =====
    location /favicon.ico {
        alias /home/studentabroad/app/StudentAbroadProject/backend/staticfiles/project/img/logo_part1.svg;
        access_log off;
        log_not_found off;
    }

    # ===== Django Application (Gunicorn через Docker Network) =====
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ===== Block common attack paths =====
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|bak|old|sql)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
