# ============================================================
# Nginx Configuration — StudentAbroad
# ============================================================
# Скопіювати на сервер:
#   sudo cp deployment/nginx/studentabroad.conf /etc/nginx/sites-available/studentabroad
#   sudo ln -s /etc/nginx/sites-available/studentabroad /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl restart nginx
#
# Потім отримати SSL:
#   sudo certbot --nginx -d studentabroad.org.ua -d www.studentabroad.org.ua
# ============================================================

# Rate Limiting Zones (додати в /etc/nginx/nginx.conf у блоці http {})
# limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=admin:10m rate=3r/s;
# limit_req_zone $binary_remote_addr zone=form:10m rate=1r/m;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name studentabroad.org.ua www.studentabroad.org.ua;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# Main HTTPS server block
server {
    listen 443 ssl http2;
    server_name studentabroad.org.ua www.studentabroad.org.ua;

    # SSL certificates (certbot автоматично заповнить після запуску)
    # ssl_certificate /etc/letsencrypt/live/studentabroad.org.ua/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/studentabroad.org.ua/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ===== Security Headers =====
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ===== Gzip Compression =====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # ===== Client Settings =====
    client_max_body_size 10M;  # Для завантаження зображень університетів

    # ===== Static Files =====
    location /static/ {
        alias /home/studentabroad/app/StudentAbroadProject/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ===== Media Files =====
    location /media/ {
        alias /home/studentabroad/app/StudentAbroadProject/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ===== Favicon =====
    location /favicon.ico {
        alias /home/studentabroad/app/StudentAbroadProject/backend/staticfiles/project/img/logo_part1.svg;
        access_log off;
        log_not_found off;
    }

    # ===== Django Application (Gunicorn) =====
    location / {
        proxy_pass http://unix:/run/gunicorn/studentabroad.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ===== Share Form Rate Limiting =====
    location /share-my-program.html {
        client_max_body_size 64k;  # Максимум 64 KB для форми
        limit_req zone=form burst=3 nodelay;

        proxy_pass http://unix:/run/gunicorn/studentabroad.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== API Rate Limiting =====
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://unix:/run/gunicorn/studentabroad.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== Admin Rate Limiting =====
    location /admin/ {
        limit_req zone=admin burst=5 nodelay;

        proxy_pass http://unix:/run/gunicorn/studentabroad.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== Block common attack paths =====
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|bak|old|sql)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
